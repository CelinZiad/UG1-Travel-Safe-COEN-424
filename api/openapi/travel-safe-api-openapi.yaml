openapi: 3.1.0
info:
  title: Travel Safe API
  description: Thin, stateless REST API exposing area safety scores for the Travel
    Safe web map and AI helpers.
  contact:
    name: Travel Safe Team
    email: celine.ziade@outlook.com
  version: 0.1.0
paths:
  /areas:
    get:
      tags:
      - areas
      summary: List Areas
      description: 'GET /areas


        List all areas (18 boroughs) with their latest safety score

        for a given time-of-day bucket (quart).'
      operationId: list_areas_areas_get
      parameters:
      - name: quart
        in: query
        required: false
        schema:
          type: string
          pattern: ^(jour|soir|nuit)$
          description: 'Time-of-day bucket: jour, soir, or nuit.'
          default: jour
          title: Quart
        description: 'Time-of-day bucket: jour, soir, or nuit.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 18
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /areas/{area_id}:
    get:
      tags:
      - areas
      summary: Get Area
      description: 'GET /areas/{id}


        Metadata + latest safety score for a given area and quart.'
      operationId: get_area_areas__area_id__get
      parameters:
      - name: area_id
        in: path
        required: true
        schema:
          type: string
          title: Area Id
      - name: quart
        in: query
        required: false
        schema:
          type: string
          pattern: ^(jour|soir|nuit)$
          description: 'Time-of-day bucket: jour, soir, or nuit.'
          default: jour
          title: Quart
        description: 'Time-of-day bucket: jour, soir, or nuit.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaScore'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /areas/{area_id}/scores:
    get:
      tags:
      - areas
      summary: Get Area Scores
      description: 'GET /areas/{id}/scores


        Historical scores for an area, optionally filtered by period range and quart.'
      operationId: get_area_scores_areas__area_id__scores_get
      parameters:
      - name: area_id
        in: path
        required: true
        schema:
          type: string
          title: Area Id
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Start period (YYYY-MM)
          title: From
        description: Start period (YYYY-MM)
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: End period (YYYY-MM)
          title: To
        description: End period (YYYY-MM)
      - name: quart
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: jour | soir | nuit. If omitted, returns all quarts.
          title: Quart
        description: jour | soir | nuit. If omitted, returns all quarts.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaHistoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /scores/latest:
    get:
      tags:
      - scores
      summary: Get Latest Scores
      description: 'GET /scores/latest


        Latest scores for all areas for a specific quart.'
      operationId: get_latest_scores_scores_latest_get
      parameters:
      - name: quart
        in: query
        required: false
        schema:
          type: string
          pattern: ^(jour|soir|nuit)$
          description: 'Time-of-day bucket: jour, soir, or nuit.'
          default: jour
          title: Quart
        description: 'Time-of-day bucket: jour, soir, or nuit.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /advice/{area_id}:
    get:
      tags:
      - ai
      summary: Get Advice For Area
      description: 'GET /advice/{area_id}


        AI-generated safety advice for an area using the latest safety score

        for the specified quart. We still call the local DistilGPT-2 model

        for the assignment requirement, but the final advice text comes from

        a deterministic helper so that users always see clean, stable advice.'
      operationId: get_advice_for_area_advice__area_id__get
      parameters:
      - name: area_id
        in: path
        required: true
        schema:
          type: string
          title: Area Id
      - name: quart
        in: query
        required: false
        schema:
          type: string
          pattern: ^(jour|soir|nuit)$
          description: 'Time-of-day bucket: jour, soir, or nuit.'
          default: jour
          title: Quart
        description: 'Time-of-day bucket: jour, soir, or nuit.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdviceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyze-route:
    post:
      tags:
      - ai
      summary: Analyze Route
      description: 'POST /analyze-route


        Multi-area route safety analysis accepting an array of area IDs.

        Uses the latest scores for the given quart and returns a concise

        summary of how safe the route is, plus practical travel tips.'
      operationId: analyze_route_analyze_route_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteAnalyzeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteAnalyzeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ask:
    post:
      tags:
      - ai
      summary: Ask Safety Question
      description: "POST /ask\n\nNatural language safety queries about Montr\xE9al\
        \ boroughs. If areaIds are\nprovided, we ground the answer using their latest\
        \ scores; otherwise we\nreturn general city-style safety advice."
      operationId: ask_safety_question_ask_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - health
      summary: Health
      description: 'Simple liveness / readiness check.

        Stateless: returns current UTC time and environment.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AdviceResponse:
      properties:
        id:
          type: string
          title: Id
        areaName:
          type: string
          title: Areaname
        borough_code:
          type: string
          title: Borough Code
        period:
          type: string
          title: Period
        quart:
          type: string
          title: Quart
        safetyScore:
          type: number
          title: Safetyscore
        colour:
          type: string
          title: Colour
        advice:
          type: string
          title: Advice
        model:
          type: string
          title: Model
        _links:
          additionalProperties:
            $ref: '#/components/schemas/Link'
          type: object
          title: Links
      type: object
      required:
      - id
      - areaName
      - borough_code
      - period
      - quart
      - safetyScore
      - colour
      - advice
      - model
      - _links
      title: AdviceResponse
    AreaHistoryResponse:
      properties:
        id:
          type: string
          title: Id
        areaName:
          type: string
          title: Areaname
        borough_code:
          type: string
          title: Borough Code
        scores:
          items:
            $ref: '#/components/schemas/AreaScore'
          type: array
          title: Scores
        _links:
          additionalProperties:
            $ref: '#/components/schemas/Link'
          type: object
          title: Links
      type: object
      required:
      - id
      - areaName
      - borough_code
      - scores
      - _links
      title: AreaHistoryResponse
    AreaListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AreaSummary'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
        _links:
          additionalProperties:
            $ref: '#/components/schemas/Link'
          type: object
          title: Links
      type: object
      required:
      - items
      - total
      - limit
      - offset
      - _links
      title: AreaListResponse
    AreaScore:
      properties:
        id:
          type: string
          title: Id
          description: Area identifier, e.g. BOROUGH#Westmount
        areaName:
          type: string
          title: Areaname
        borough_code:
          type: string
          title: Borough Code
        period:
          type: string
          title: Period
          description: YYYYMM, e.g. 201201
        quart:
          type: string
          title: Quart
          description: 'Time-of-day bucket: jour, soir, or nuit'
        risk_crime:
          type: number
          title: Risk Crime
        risk_acc:
          type: number
          title: Risk Acc
        risk_total:
          type: number
          title: Risk Total
        numIncidentsCrime:
          type: integer
          title: Numincidentscrime
        numIncidentsAccidents:
          type: integer
          title: Numincidentsaccidents
        safetyScore:
          type: number
          title: Safetyscore
        colour:
          type: string
          title: Colour
        _links:
          $ref: '#/components/schemas/Links'
      type: object
      required:
      - id
      - areaName
      - borough_code
      - period
      - quart
      - risk_crime
      - risk_acc
      - risk_total
      - numIncidentsCrime
      - numIncidentsAccidents
      - safetyScore
      - colour
      - _links
      title: AreaScore
    AreaSummary:
      properties:
        id:
          type: string
          title: Id
        areaName:
          type: string
          title: Areaname
        borough_code:
          type: string
          title: Borough Code
        latestPeriod:
          type: string
          title: Latestperiod
        quart:
          type: string
          title: Quart
        safetyScore:
          type: number
          title: Safetyscore
        colour:
          type: string
          title: Colour
        _links:
          $ref: '#/components/schemas/Links'
      type: object
      required:
      - id
      - areaName
      - borough_code
      - latestPeriod
      - quart
      - safetyScore
      - colour
      - _links
      title: AreaSummary
    AskRequest:
      properties:
        query:
          type: string
          title: Query
          description: Natural language safety question.
          examples:
          - Is it safe to walk alone in the evening?
        areaIds:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Areaids
          description: Optional area IDs to ground the answer in specific boroughs.
          examples:
          - - BOROUGH#Westmount
            - BOROUGH#Saint-Laurent
        quart:
          anyOf:
          - type: string
            pattern: ^(jour|soir|nuit)$
          - type: 'null'
          title: Quart
          description: Optional default quart for the question context.
          examples:
          - soir
      type: object
      required:
      - query
      title: AskRequest
    AskResponse:
      properties:
        answer:
          type: string
          title: Answer
        model:
          type: string
          title: Model
        _links:
          additionalProperties:
            $ref: '#/components/schemas/Link'
          type: object
          title: Links
      type: object
      required:
      - answer
      - model
      - _links
      title: AskResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Link:
      properties:
        href:
          type: string
          title: Href
      type: object
      required:
      - href
      title: Link
    Links:
      properties:
        self:
          $ref: '#/components/schemas/Link'
        scores:
          anyOf:
          - $ref: '#/components/schemas/Link'
          - type: 'null'
        latest:
          anyOf:
          - $ref: '#/components/schemas/Link'
          - type: 'null'
        collection:
          anyOf:
          - $ref: '#/components/schemas/Link'
          - type: 'null'
      type: object
      required:
      - self
      title: Links
    RouteAnalyzeRequest:
      properties:
        areaIds:
          items:
            type: string
          type: array
          title: Areaids
          description: Array of area IDs (e.g., BOROUGH#Westmount, BOROUGH#Saint-Laurent)
          examples:
          - - BOROUGH#Westmount
            - BOROUGH#Saint-Laurent
        quart:
          type: string
          pattern: ^(jour|soir|nuit)$
          title: Quart
          description: Time-of-day bucket for the route.
          default: jour
          examples:
          - jour
      type: object
      required:
      - areaIds
      title: RouteAnalyzeRequest
    RouteAnalyzeResponse:
      properties:
        areas:
          items:
            $ref: '#/components/schemas/RouteAreaSummary'
          type: array
          title: Areas
        routeAdvice:
          type: string
          title: Routeadvice
        model:
          type: string
          title: Model
        _links:
          additionalProperties:
            $ref: '#/components/schemas/Link'
          type: object
          title: Links
      type: object
      required:
      - areas
      - routeAdvice
      - model
      - _links
      title: RouteAnalyzeResponse
    RouteAreaSummary:
      properties:
        id:
          type: string
          title: Id
        areaName:
          type: string
          title: Areaname
        borough_code:
          type: string
          title: Borough Code
        period:
          type: string
          title: Period
        quart:
          type: string
          title: Quart
        safetyScore:
          type: number
          title: Safetyscore
        colour:
          type: string
          title: Colour
        numIncidentsCrime:
          type: integer
          title: Numincidentscrime
        numIncidentsAccidents:
          type: integer
          title: Numincidentsaccidents
      type: object
      required:
      - id
      - areaName
      - borough_code
      - period
      - quart
      - safetyScore
      - colour
      - numIncidentsCrime
      - numIncidentsAccidents
      title: RouteAreaSummary
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
